openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /collector/status:
    get:
      operationId: getCollectorStatus
      responses:
        "200":
          description: Manifest and active job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorStatus"
  /collector/pull:
    post:
      operationId: startHistoricalPull
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorJob"
  /collector/refresh:
    post:
      operationId: refreshCurrentSeason
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorJob"
  /collector/weather:
    post:
      operationId: startWeatherPull
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeatherInput"
      responses:
        "202":
          description: Weather job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorJob"
  /collector/weather/resume:
    post:
      operationId: resumeWeatherPull
      responses:
        "202":
          description: Resumed interrupted weather job using saved caches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorJob"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    WeatherInput:
      type: object
      properties:
        refreshVenues: { type: boolean, default: false }
    CollectorFile:
      type: object
      required: [file, season, type, rowCount, pulledAt, bytes, warnings]
      properties:
        file: { type: string }
        season: { type: integer }
        type: { type: string, enum: [games, lines, drives, venues, weather] }
        rowCount: { type: integer }
        pulledAt: { type: string }
        bytes: { type: integer }
        warnings: { type: array, items: { type: string } }
    CollectorJob:
      type: object
      required: [state, mode, message, completedFiles, totalFiles, calls, skippedFiles, startedAt, finishedAt, error]
      properties:
        state: { type: string, enum: [idle, running, completed, failed, interrupted] }
        mode: { type: string }
        message: { type: string }
        completedFiles: { type: integer }
        totalFiles: { type: integer }
        calls: { type: integer }
        skippedFiles: { type: integer }
        startedAt: { type: [string, "null"] }
        finishedAt: { type: [string, "null"] }
        interruptedAt: { type: [string, "null"] }
        error: { type: [string, "null"] }
    CollectorStatus:
      type: object
      required: [files, job, keyConfigured, currentSeason, expectedFiles]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/CollectorFile" }
        job: { $ref: "#/components/schemas/CollectorJob" }
        keyConfigured: { type: boolean }
        currentSeason: { type: integer }
        expectedFiles: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

